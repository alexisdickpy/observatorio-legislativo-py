# Configuración de Pages CMS (docs/edicion-de-textos.md). Los datos del Congreso (datos/fuente/) no están
# aquí a propósito: el importador pisaría cualquier cambio. Cada campo de un archivo debe figurar aquí, y
# pruebas/unidad/contenido.test.js lo comprueba.
settings:
  hide: true
  content:
    merge: true
  commit:
    templates:
      update: "Editar {path} desde Pages CMS"

