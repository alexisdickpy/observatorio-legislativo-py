name: Pruebas

on:
  pull_request:
  push:
    branches: [main]
    paths: ["importador/**", "sitio/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importador:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Pruebas del importador
        run: python3 -m unittest discover -s importador/pruebas -t . -v

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pruebas del bot de Telegram
        working-directory: bot
        run: npm test

  sitio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sitio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: sitio/.node-version
          cache: npm
          cache-dependency-path: sitio/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas unitarias del sitio
        run: npm test
      - name: Compilar el sitio
        run: npm run build
      - name: Comprobar el sitio compilado
        run: npm run test:compilacion
